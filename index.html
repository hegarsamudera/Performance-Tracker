// Firestore doc ID gak boleh mengandung "/", key kita (mis. "day:2026-09-15") aman karena
// cuma pakai ":" dan "-". Kalau suatu saat ada key aneh yang mengandung "/", di-encode dulu.
function docIdFor(key) {
  return key.replace(/\//g, "__slash__");
}

window.storage = {
  get: async (key) => {
    const snap = await KV.doc(docIdFor(key)).get();
    if (!snap.exists) throw new Error("not found");
    const data = snap.data();
    return { key, value: data.value };
  },
  set: async (key, value) => {
    await KV.doc(docIdFor(key)).set({ key, value });
    return { key, value };
  },
  delete: async (key) => {
    await KV.doc(docIdFor(key)).delete();
    return { key, deleted: true };
  },
  list: async (prefix) => {
    let q = KV;
    if (prefix) {
      q = q.where("key", ">=", prefix).where("key", "<", prefix + "\uf8ff");
    }
    const snap = await q.get();
    const keys = [];
    snap.forEach((doc) => keys.push(doc.data().key));
    return { keys };
  },
};

function pad(n) {
  return String(n).padStart(2, "0");
}
function isoOf(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function todayISO() {
  return isoOf(new Date());
}
function nowHM() {
  const d = new Date();
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function shiftDate(iso, days) {
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + days);
  return isoOf(d);
}
function shiftWorkday(iso, dir) {
  let d = shiftDate(iso, dir);
  let day = new Date(d + "T00:00:00").getDay();
  while (day === 0 || day === 6) {
    d = shiftDate(d, dir);
    day = new Date(d + "T00:00:00").getDay();
  }
  return d;
}
function nearestWorkday(iso) {
  const day = new Date(iso + "T00:00:00").getDay();
  if (day === 0) return shiftDate(iso, -2);
  if (day === 6) return shiftDate(iso, -1);
  return iso;
}
function mondayOf(iso) {
  const d = new Date(iso + "T00:00:00");
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return isoOf(d);
}
function fmtLabel(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long" });
}
function fmtShort(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("id-ID", { day: "numeric", month: "short" });
}
function newId() {
  return `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
}
function csvField(v) {
  const s = String(v ?? "");
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function toCSV(rows) {
  return "\uFEFF" + rows.map((r) => r.map(csvField).join(",")).join("\r\n");
}
function toTSV(rows) {
  return rows.map((r) => r.map((v) => String(v ?? "").replace(/\t/g, " ").replace(/\n/g, " ")).join("\t")).join("\n");
}
function downloadCSV(filename, text) {
  const blob = new Blob([text], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function emptyEntry() {
  return { called: false, sign: 0, ho: 0, followUps: [] };
}
function emptyDay(list) {
  const obj = {};
  list.forEach((n) => (obj[n] = emptyEntry()));
  return obj;
}

// Cari nilai "sign" (kumulatif) terakhir yang tercatat untuk tiap nama AM,
// pada atau sebelum tanggal tertentu. Dipakai buat auto-carry sign pas ganti hari,
// dan buat menghitung "sign hari ini" / "sign minggu ini" (selisih dari baseline).
async function getFieldSnapshot(names, atOrBeforeDate, field) {
  const remaining = new Set(names);
  const map = {};
  try {
    const listRes = await window.storage.list("day:");
    const keys = (listRes && listRes.keys) || [];
    const dates = keys
      .map((k) => k.slice(4))
      .filter((d) => d <= atOrBeforeDate)
      .sort()
      .reverse();
    for (const d of dates) {
      if (remaining.size === 0) break;
      try {
        const res = await window.storage.get(`day:${d}`);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          remaining.forEach((n) => {
            if (parsed[n] && parsed[n][field] != null) map[n] = Number(parsed[n][field]) || 0;
          });
          [...remaining].forEach((n) => {
            if (map[n] != null) remaining.delete(n);
          });
        }
      } catch (e) {}
    }
  } catch (e) {}
  names.forEach((n) => {
    if (map[n] == null) map[n] = 0;
  });
  return map;
}
function getSignSnapshot(names, atOrBeforeDate) {
  return getFieldSnapshot(names, atOrBeforeDate, "sign");
}
function getHoSnapshot(names, atOrBeforeDate) {
  return getFieldSnapshot(names, atOrBeforeDate, "ho");
}

function TeamTrendChart({ dates, series, metricLabel }) {
  const canvasRef = React.useRef(null);
  const chartRef = React.useRef(null);
  React.useEffect(() => {
    if (!canvasRef.current || !window.Chart) return;
    if (chartRef.current) chartRef.current.destroy();
    const palette = ["#2F6D4F", "#38508C", "#B4562B", "#8A4FB0", "#B0355C", "#3B8C8C", "#8C7A2F", "#5C5C5C"];
    chartRef.current = new window.Chart(canvasRef.current, {
      type: "line",
      data: {
        labels: dates.map((d) => fmtShort(d)),
        datasets: series.map((s, i) => ({
          label: s.name,
          data: s.values,
          borderColor: palette[i % palette.length],
          backgroundColor: palette[i % palette.length],
          tension: 0.25,
          pointRadius: 2,
          borderWidth: 2,
        })),
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 11 } } } },
        scales: {
          y: { beginAtZero: true, title: { display: true, text: metricLabel } },
          x: { ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 8 } },
        },
      },
    });
    return () => {
      if (chartRef.current) chartRef.current.destroy();
    };
  }, [dates, series, metricLabel]);
  return (
    <div style={{ height: 320 }}>
      <canvas ref={canvasRef}></canvas>
    </div>
  );
}

          const res = await window.storage.get(`day:${iso}`);
          if (res && res.value) {
            const parsed = JSON.parse(res.value);
            amList.forEach((n) => {
              const e = parsed[n];
              if (!e) return;
              if (e.called) agg[n].calledDays += 1;
              (Array.isArray(e.followUps) ? e.followUps : []).forEach((f) => agg[n].followUps.push({ ...f, date: iso }));
            });
          }
        } catch (e) {
          // gak ada data di tanggal itu — lewati
        }
      }
      // "sign"/"ho" itu angka kumulatif (kebawa tiap hari), jadi angka minggu ini = nilai akhir - nilai sebelum minggu mulai
      if (!cancelled) {
        const baseline = await getSignSnapshot(amList, shiftDate(weekStart, -1));
        const final = await getSignSnapshot(amList, range[range.length - 1]);
        const hoBaselineWk = await getHoSnapshot(amList, shiftDate(weekStart, -1));
        const hoFinalWk = await getHoSnapshot(amList, range[range.length - 1]);
        if (!cancelled) {
          amList.forEach((n) => {
            agg[n].signs = Math.max(0, (final[n] || 0) - (baseline[n] || 0));
            agg[n].ho = Math.max(0, (hoFinalWk[n] || 0) - (hoBaselineWk[n] || 0));
          });
        }
      }
      if (!cancelled) {
        setWeekly({ range, byAm: agg });
        setWeeklyLoading(false);
      }
    })();
    return () => { cancelled = true; };

        const dateRangeSet = new Set(dateRange);

        const listRes = await window.storage.list("day:");
        const keys = (listRes && listRes.keys) || [];
        const relevantDates = keys.map((k) => k.slice(4)).filter((d) => d <= endDate).sort();

        const perDate = {};
        for (const d of relevantDates) {
          try {
            const res = await window.storage.get(`day:${d}`);
            if (res && res.value) perDate[d] = JSON.parse(res.value);

        }

        // Gabung semua tanggal histori + tanggal yang mau ditampilin, urut, terus jalan maju sambil
        // "bawa" nilai terakhir yang diketahui tiap AM (forward-fill) — biar hari yang gak diisi
        // (weekend, dsb) tetap kepakai angka terakhir, bukan 0.

        const fields = trendMetric === "point" ? ["sign", "ho"] : [trendMetric];
        const combinedDates = Array.from(new Set([...relevantDates, ...dateRange])).sort();
        const lastKnown = {};
        amList.forEach((n) => {

        combinedDates.forEach((d) => {

            const snap = {};
            amList.forEach((n) => {

  const handleLeadsFileChange = async (ev) => {
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!file) return;
    setUploading(true);
    setUploadMsg("");
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
      if (!rows || rows.length === 0) {
        setUploadMsg("⚠️ File kosong atau gak kebaca.");
        setUploading(false);
        return;
      }
      const headers = (rows[0] || []).map((h) => String(h || ""));
      const findCol = (matcher) => {
        for (let i = 0; i < headers.length; i++) if (matcher(headers[i])) return i;
        return -1;
      };
      let ownerIdx = findCol((h) => /owner/i.test(h));
      let aptIdx = findCol((h) => /apart/i.test(h));
      let amIdx = findCol((h) => /\bam\b/i.test(h) || /acquisition/i.test(h) || /manager/i.test(h));
      const hasHeaderRow = ownerIdx !== -1 || aptIdx !== -1 || amIdx !== -1;
      if (ownerIdx === -1) ownerIdx = 0;
      if (aptIdx === -1) aptIdx = 1;
      if (amIdx === -1) amIdx = 2;
      const dataRows = hasHeaderRow ? rows.slice(1) : rows;

      const amMap = {};
      amList.forEach((n) => {
        amMap[n.trim().toLowerCase()] = n;
      });
      const unmatchedAm = new Set();
      const newEntries = [];
      dataRows.forEach((r) => {
        const ownerVal = String((r && r[ownerIdx]) ?? "").trim();
        const aptVal = String((r && r[aptIdx]) ?? "").trim();
        const amValRaw = String((r && r[amIdx]) ?? "").trim();
        if (!ownerVal && !aptVal && !amValRaw) return;
        const matched = amMap[amValRaw.toLowerCase()];
        if (!matched && amValRaw) unmatchedAm.add(amValRaw);
        newEntries.push({
          id: newId(),
          am: matched || amValRaw || "(AM tidak dikenali)",
          name: ownerVal,
          apartemen: aptVal,
          remarks: "",
          addedDate: date,
        });
      });

      if (newEntries.length === 0) {
        setUploadMsg("⚠️ Gak ada baris data yang kebaca dari file itu.");
      } else {
        setLeadsIn((prev) => [...prev, ...newEntries]);
        let msg = `✅ ${newEntries.length} leads in kemarin berhasil diimpor untuk ${fmtShort(date)}`;
        if (unmatchedAm.size) msg += ` — AM gak dikenal: ${[...unmatchedAm].join(", ")}`;
        setUploadMsg(msg);
      }
    } catch (e) {
      console.error("gagal upload leads in", e);
      setUploadMsg("⚠️ Gagal membaca file. Pastikan formatnya .xlsx, .xls, atau .csv.");
    } finally {

      lines.push("");
      lines.push(`*${name}*`);
      lines.push(r.called ? "✅ Sudah isi data hari ini" : "❌ Belum isi data hari ini");
      if (r.pendingLeadsIn.length) {
        lines.push(`🆕 Leads In (Kemarin) (${r.pendingLeadsIn.length}):`);
        r.pendingLeadsIn.forEach((l) => lines.push(`   • ${l.name || "-"} — ${l.apartemen || "-"}${l.remarks ? ` (${l.remarks})` : ""}`));
      }
      if (r.gmeet.length) {
        lines.push(`📅 Gmeet Hari Ini (${r.gmeet.length}):`);
        r.gmeet.forEach((g) => lines.push(`   • ${g.name || "-"} — ${g.apartemen || "-"}${g.remarks ? ` (${g.remarks})` : ""}`));
      }
      if (r.pendingLeads.length) {
        lines.push(`🔥 Hot Leads Pending (${r.pendingLeads.length}):`);
        r.pendingLeads.forEach((h) => lines.push(`   • ${h.name || "-"} — ${h.apartemen || "-"}${h.remarks ? ` (${h.remarks})` : ""}`));
      }
      if (r.mtdSign > 0) {
        lines.push(`✅ Sign Total MTD: ${r.mtdSign}${r.todaySign > 0 ? ` (Today: ${r.todaySign})` : ""}`);
      }
      if (r.mtdHo > 0) {
        lines.push(`🔑 HO Total MTD: ${r.mtdHo}${r.todayHo > 0 ? ` (Today: ${r.todayHo})` : ""}`);
      }
      if (r.turndown.length) {
        lines.push(`❌ Turndown (${r.turndown.length}):`);
        r.turndown.forEach((h) => lines.push(`   • ${h.name || "-"} — ${h.turndownReason || "-"}${h.remarks ? ` (${h.remarks})` : ""}`));
      }
      const openFollow = r.followUps.filter((f) => !f.done);
      if (openFollow.length) {
        lines.push(`📋 Follow up belum selesai:`);
        openFollow.forEach((f) => lines.push(`   • ${f.text}`));
      }
    });

    const notCalled = rows.filter((x) => !x.r.called).map((x) => x.name);
    if (notCalled.length) {
      lines.push("");
      lines.push(DIVIDER);
      lines.push("");
      lines.push(`❗ *Belum isi data (${notCalled.length}):*`);
      notCalled.forEach((n) => lines.push(`   • ${n}`));
    }
    return lines.join("\n");
  };

  const fetchDailyLogRows = async () => {
    const header = ["Tanggal", "AM", "Tim", "Sudah Isi Data", "Sign (Hari Ini)", "Sign (Kumulatif)", "HO (Hari Ini)", "HO (Kumulatif)", "Follow Up"];
    const listRes = await window.storage.list("day:");
    const keys = (listRes && listRes.keys) || [];
    const byName = {};
    for (const key of keys) {
      try {
        const res = await window.storage.get(key);
        if (!res || !res.value) continue;
        const dateStr = key.replace(/^day:/, "");
        const parsed = JSON.parse(res.value);
        amList.forEach((name) => {
          const e = parsed[name];
          if (!e) return;
          const followUpsText = (Array.isArray(e.followUps) ? e.followUps : []).map((f) => `${f.done ? "[selesai]" : "[belum]"} ${f.text}`).join(" | ") || "-";
          if (!byName[name]) byName[name] = [];
          byName[name].push({ dateStr, called: e.called, signCum: Number(e.sign) || 0, hoCum: Number(e.ho) || 0, followUpsText });
        });
      } catch (e) {}
    }
    const teamNameOf = (name) => {
      const t = teams.find((t) => t.memberNames.includes(name));
      return t ? t.name : "Belum dikelompokkan";
    };
    // sign & ho disimpan kumulatif, jadi "hari ini" per AM = selisih dari hari sebelumnya yang tercatat
    const body = [];
    Object.keys(byName).forEach((name) => {
      const rows = byName[name].sort((a, b) => a.dateStr.localeCompare(b.dateStr));
      let prevSignCum = null;
      let prevHoCum = null;
      rows.forEach((r) => {
        const signDelta = prevSignCum === null ? r.signCum : Math.max(0, r.signCum - prevSignCum);
        const hoDelta = prevHoCum === null ? r.hoCum : Math.max(0, r.hoCum - prevHoCum);
        prevSignCum = r.signCum;
        prevHoCum = r.hoCum;
        body.push([r.dateStr, name, teamNameOf(name), r.called ? "Ya" : "Tidak", String(signDelta), String(r.signCum), String(hoDelta), String(r.hoCum), r.followUpsText]);
      });
    });
    body.sort((a, b) => a[0].localeCompare(b[0]) || a[1].localeCompare(b[1]));
    return [header, ...body];
  };

          dump[k] = res.value;
        } catch (e) {}
      }
      const payload = { exportedAt: new Date().toISOString(), data: dump };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;

        .kanban-col-title-input { flex: 1; border: none; background: transparent; font-size: 13px; font-weight: 700; font-family: inherit; color: var(--ink); border-bottom: 1px dashed var(--line); padding: 2px 0; min-width: 0; }
        .kanban-col-title-input:focus { outline: none; border-bottom-color: var(--done); }
        .kanban-col-count { font-size: 11px; color: var(--muted); font-weight: 600; }
        .kanban-leader-select { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font-size: 11.5px; font-family: inherit; background: var(--bg); color: var(--muted); }
        .kanban-col-body { display: flex; flex-direction: column; gap: 6px; min-height: 40px; }
        .kanban-empty { font-size: 11px; color: var(--muted); text-align: center; padding: 10px 0; border: 1px dashed var(--line); border-radius: 6px; }
        .am-card { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 8px; cursor: grab; display: flex; flex-direction: column; gap: 4px; }
        .am-card:active { cursor: grabbing; }
        .am-card-name { font-size: 12.5px; font-weight: 500; }
        .am-card select { width: 100%; border: 1px solid var(--line); border-radius: 5px; padding: 3px 4px; font-size: 11px; font-family: inherit; background: var(--panel); color: var(--muted); }

        .teamlist { display: flex; flex-direction: column; gap: 8px; }
        .team-perf-row { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 10px 12px; }
        .team-perf-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; flex-wrap: wrap; }
        .team-perf-name { font-weight: 700; font-size: 14px; }
        .team-perf-leader { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
        .team-perf-badges { display: flex; align-items: center; gap: 6px; }
        .team-perf-members { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
        .team-perf-member { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; }
        .team-perf-member-nums { color: var(--muted); font-weight: 600; font-size: 12px; }

        <span className="brandsep">|</span>
        <span className="brandlabel display">AM Tracker</span>
      </div>
      <div className="subtitle">{amList.length} Acquisition Manager · diisi langsung oleh ketua kelompok</div>

      <div className="tabs">
        <button className={`tab ${view === "today" ? "active" : ""}`} onClick={() => setView("today")}>Hari Ini</button>
        <button className={`tab ${view === "weekly" ? "active" : ""}`} onClick={() => setView("weekly")}>Ringkasan Mingguan</button>
        <button className={`tab ${view === "briefing" ? "active" : ""}`} onClick={() => setView("briefing")}>📋 Rangkuman Harian</button>
        <button className={`tab ${view === "export" ? "active" : ""}`} onClick={() => setView("export")}>⬇️ Export</button>
        <button className={`tab ${view === "teamperf" ? "active" : ""}`} onClick={() => setView("teamperf")}>🏆 Performance Tim</button>
        <button className={`tab ${view === "manage" ? "active" : ""}`} onClick={() => setView("manage")}>👥 Kelola AM</button>
      </div>

      {view === "today" && (
        <>
          {teams.length > 0 && (
            <div className="tabs subtabs">
              <button className={`tab ${activeTeamTab === "all" ? "active" : ""}`} onClick={() => selectTeamTab("all")}>Semua</button>
              {teams.map((t) => (
                <button key={t.id} className={`tab ${activeTeamTab === t.id ? "active" : ""}`} onClick={() => selectTeamTab(t.id)}>{t.name}</button>
              ))}
              {unassignedList.length > 0 && (
                <button className={`tab ${activeTeamTab === "unassigned" ? "active" : ""}`} onClick={() => selectTeamTab("unassigned")}>Belum dikelompokkan</button>
              )}
            </div>
          )}

          {teamSummary && (
            <div className="team-summary-card">
              <div className="team-summary-title">
                📊 Performance {teamSummary.team.name}
                {teamSummary.team.leaderName ? ` — Ketua: ${teamSummary.team.leaderName}` : ""}
              </div>
              <div className="team-summary-grid">
                <div className="team-summary-item"><div className="n display">{teamSummary.signToday}</div><div className="l">✅ Sign Hari Ini</div></div>
                <div className="team-summary-item"><div className="n display">{teamSummary.signMtd}</div><div className="l">✅ Sign MTD</div></div>
                <div className="team-summary-item"><div className="n display">{teamSummary.hoToday}</div><div className="l">🔑 HO Hari Ini</div></div>
                <div className="team-summary-item"><div className="n display">{teamSummary.hoMtd}</div><div className="l">🔑 HO MTD</div></div>
              </div>
              <div className="team-point-box">
                <div className="team-point-label">🏆 Poin Tim <span className="team-point-note">(Sign MTD + HO MTD)</span></div>
                <div className="team-point-value display">{teamSummary.signMtd + teamSummary.hoMtd}</div>
              </div>
            </div>
          )}

          <div className="datebar">
            <button className="navbtn" onClick={() => setDate((d) => shiftWorkday(d, -1))}>◂</button>
            <div className="label">{fmtLabel(date)}{isToday && <span className="today-pill">Hari ini</span>}</div>
            <button className="navbtn" onClick={() => setDate((d) => shiftWorkday(d, 1))}>▸</button>
          </div>

          <div className="stats">
            <div className="stat"><div className="n display">{stats.called}/{filteredAmList.length}</div><div className="l">✅ Sudah isi data</div></div>
            <div className="stat"><div className="n display">{totalPending}</div><div className="l">Hot leads pending</div></div>
            <div className="stat"><div className="n display">{stats.signs}</div><div className="l">Sign MTD</div></div>
          </div>
          <div className="stats">
            <div className="stat"><div className="n display">{totalPendingLeadsIn}</div><div className="l">🆕 Total Leads In Kemarin</div></div>
            <div className="stat"><div className="n display">{totalGmeetToday}</div><div className="l">📅 Gmeet hari ini</div></div>
            <div className="stat"><div className="n display">{stats.ho}</div><div className="l">🔑 HO MTD</div></div>
          </div>

          <div className="upload-bar">
            <button className="uploadbtn" disabled={uploading} onClick={() => leadsFileInputRef.current && leadsFileInputRef.current.click()}>
              {uploading ? "Mengimpor..." : "⬆️ Upload Leads Kemarin"}
            </button>
            <input
              type="file"
              accept=".xlsx,.xls,.csv"
              ref={leadsFileInputRef}
              style={{ display: "none" }}
              onChange={handleLeadsFileChange}
            />
            {uploadMsg && <span className="upload-msg">{uploadMsg}</span>}
          </div>

          <div className="list">
            {loading || amListLoading || teamsLoading || hotLeadsLoading || leadsInLoading || gmeetLoading ? (
              <div className="empty">Memuat data...</div>
            ) : amList.length === 0 ? (
              <div className="empty">Belum ada AM. Tambahin dulu lewat tab "Kelola AM".</div>
            ) : filteredAmList.length === 0 ? (
              <div className="empty">Gak ada AM di kelompok ini.</div>
            ) : (
              filteredAmList.map((name) => {
                const e = data[name] || emptyEntry();
                const isOpen = expanded === name;
                const needsReminder = isToday && !e.called && nowHour >= REMINDER_HOUR;
                const openFollow = e.followUps.filter((f) => !f.done).length;
                const pending = pendingFor(name);
                const leadsInPending = pendingLeadsInFor(name);
                const gmeetList = gmeetFor(name);
                return (
                  <div className={`row ${needsReminder ? "reminder" : ""}`} key={name}>
                    <div className="row-main">
                      <button className={`fillbtn ${e.called ? "on" : ""}`} onClick={() => toggleCalled(name)} title={e.called ? "Sudah isi data hari ini" : "Belum isi data hari ini"}>
                        {e.called ? "✅" : needsReminder ? "⚠️" : "⬜"}
                      </button>
                      <div className="name"><span>{name}</span></div>
                      {!e.called && <span className={`fillstatus ${needsReminder ? "warn" : ""}`}>{needsReminder ? "⚠️ Belum isi" : "Belum isi"}</span>}
                      {pending.length > 0 && <span className="countpill">🔥 {pending.length}</span>}
                      {leadsInPending.length > 0 && <span className="countpill leadsin">🆕 {leadsInPending.length}</span>}
                      {gmeetList.length > 0 && <span className="countpill gmeet">📅 {gmeetList.length}</span>}
                      {openFollow > 0 && <span className="countpill">📋 {openFollow}</span>}
                      <div className="mini-field" title="Total sign kumulatif — otomatis kebawa dari hari sebelumnya, tinggal ditambah kalau ada sign baru">
                        <label>Sign</label>
                        <input type="number" min="0" value={e.sign} onChange={(ev) => setEntry(name, { sign: ev.target.value })} />
                      </div>
                      <div className="mini-field" title="Total HO (handover) kumulatif — otomatis kebawa dari hari sebelumnya, tinggal ditambah kalau ada HO baru">
                        <label>HO</label>
                        <input type="number" min="0" value={e.ho} onChange={(ev) => setEntry(name, { ho: ev.target.value })} />
                      </div>
                      <button className="expbtn" onClick={() => setExpanded(isOpen ? null : name)}>{isOpen ? "▾" : "▸"}</button>
                    </div>
                    {isOpen && (
                      <div className="detail-panel">
                        <div>
                          <div className="section-label">Hot Leads (belum ada jawaban)</div>
                          {pending.length === 0 && (
                            <div style={{ fontSize: 12, color: "var(--muted)", marginBottom: 8 }}>Gak ada hot leads yang nge-gantung.</div>
                          )}
                          {pending.map((h) => (
                            <div className="hl-card" key={h.id}>
                              <div className="hl-row">
                                <input className="hl-name" type="text" placeholder="Nama calon owner" value={h.name} onChange={(ev) => updateHotLead(h.id, "name", ev.target.value)} />
                                <input className="hl-apt" type="text" placeholder="Nama apartemen" value={h.apartemen} onChange={(ev) => updateHotLead(h.id, "apartemen", ev.target.value)} />
                                <button className="iconbtn" onClick={() => removeHotLead(h.id)} title="Hapus">✕</button>

              {trendLoading || !trendData ? (
                <div className="empty">Menghitung tren...</div>
              ) : trendData.series.length === 0 ? (
                <div className="empty">Belum ada AM atau tim. Bikin dulu lewat tab "Kelola AM".</div>
              ) : (
                <TeamTrendChart
                  dates={trendData.dates}
                  series={trendData.series}
                  metricLabel={trendMetric === "point" ? "Poin Tim (Sign + HO)" : trendMetric === "sign" ? "Total Sign (kumulatif)" : "Total HO (kumulatif)"}
                />
              )}
              <div className="manage-note" style={{ marginTop: 12 }}>
                Grafik ini nampilin angka <b>kumulatif</b> tim (bukan tambahan harian), jadi garis naik terus itu normal — artinya progress
                makin nambah. Komposisi tim yang dipakai adalah komposisi tim <b>saat ini</b>, bukan histori tim di tanggal-tanggal sebelumnya.
              </div>
            </>
          )}
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AMCallTracker />);
</script>
</body>
</html>
